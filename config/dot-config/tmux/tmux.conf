unbind C-b
set-option -g prefix C-q
bind-key C-q send-prefix

set-option -g history-limit 50000
set -g mouse on

set -sg escape-time 10
set-option -g focus-events on

# for clocker/claude notifications
set -g allow-passthrough on

setw -g mode-keys vi

set -g status on
set -g status-position top
set -g status-interval 15
set -g status-bg default
set -g status-justify left

set -g status-style "fg=#218693"

set -g status-left-length 50
set -g status-left-style default
set -g status-left "#(pomo)"
set -g status-right-style default
set -g status-right-length 60
set -g status-right "#[fg=#77dfd8]#S  #[fg=#218693]#( ~/.config/tmux/right_status.sh )"

set -g window-status-current-style "fg=#77dfd8"

set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

set-option -g renumber-windows on

# reload configuration
bind-key -r r source-file ~/.config/tmux/tmux.conf

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'

set-option -g default-terminal "screen-256color"

# other key bindings
bind \\ split-window -h
bind - split-window -v

TMUX_FZF_LAUNCH_KEY="C-q"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '$HOME/.config/tmux/plugins/'

# keep this line at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'
