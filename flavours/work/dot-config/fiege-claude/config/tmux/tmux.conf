# container tmux — prefix C-a (host uses C-q, avoid collision)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-option -g history-limit 50000
set -g mouse on

set -sg escape-time 10
set-option -g focus-events on

setw -g mode-keys vi

set -g status on
set -g status-position top
set -g status-interval 15
set -g status-bg default
set -g status-justify left

set -g status-style "fg=#5d5d5d,bg=#c75646"

set -g status-left-length 50
set -g status-left-style default
set -g status-left ""
set -g status-right-style default
set -g status-right-length 60
set -g status-right "#[fg=#4d4d4d][#H #S]"

set -g window-status-current-style "fg=#8eb33b"

# count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

set-option -g renumber-windows on

# reload configuration
bind-key -r r source-file ~/.tmux.conf

set-option -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:UTF-8"
set-option -g update-environment "LANG LC_ALL LC_CTYPE"

# other key bindings
bind \\ split-window -h
bind - split-window -v

